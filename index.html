    // 1. Creates the Royal Purple & Gold Backing Card Texture (No external image tainting!)
    function createFrameBackingTexture(photoObj) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 640;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 512, 640);
      grad.addColorStop(0, '#2e1065');
      grad.addColorStop(0.5, '#4c1d95');
      grad.addColorStop(1, '#831843');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 640);

      // Gold Outer Border
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 14;
      ctx.strokeRect(14, 14, 484, 612);

      // Inner Placeholder Box (Behind the actual 3D Photo Plane)
      ctx.fillStyle = '#1e1b4b';
      ctx.fillRect(36, 36, 440, 440);
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 8;
      ctx.strokeRect(36, 36, 440, 440);

      // Fallback text if local file path is missing or blocked by file:// protocol
      ctx.fillStyle = '#c084fc';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('📸 Loading Photo...', 256, 240);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '15px sans-serif';
      ctx.fillText(`(${photoObj.url})`, 256, 275);

      // Bottom Caption Banner
      ctx.fillStyle = '#fef08a';
      ctx.font = 'bold 25px Fredoka, sans-serif';
      ctx.fillText(photoObj.title, 256, 525);

      ctx.fillStyle = '#f5d0fe';
      ctx.font = '20px sans-serif';
      ctx.fillText(`@samimpriyu • ${photoObj.tag}`, 256, 565);

      ctx.fillStyle = '#fbbf24';
      ctx.font = 'italic 18px serif';
      ctx.fillText('✨ Samima Begum • Oct 28 ✨', 256, 602);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    // 2. Loads Local or Uploaded Photo directly onto the 3D Photo Plane
    function applyPhotoTextureToMesh(photoMesh, url) {
      if (!photoMesh) return;

      // Method A: Direct Three.js TextureLoader (Works on GitHub Pages, localhost, and data URLs)
      const loader = new THREE.TextureLoader();
      loader.load(
        url,
        (tex) => {
          tex.encoding = THREE.sRGBEncoding;
          photoMesh.material.map = tex;
          photoMesh.material.color.setHex(0xffffff);
          photoMesh.material.transparent = false;
          photoMesh.material.opacity = 1;
          photoMesh.material.needsUpdate = true;
        },
        undefined,
        () => {
          // Fallback: Standard HTML Image without crossOrigin for local relative paths
          const img = new Image();
          img.onload = () => {
            const tex = new THREE.Texture(img);
            tex.needsUpdate = true;
            photoMesh.material.map = tex;
            photoMesh.material.color.setHex(0xffffff);
            photoMesh.material.transparent = false;
            photoMesh.material.opacity = 1;
            photoMesh.material.needsUpdate = true;
          };
          img.src = url;
        }
      );
    }

        const reader = new FileReader();
        reader.onload = (e) => {

            const updated = [...prev];
            updated[index] = { ...updated[index], url: dataUrl };
            return updated;

        reader.readAsDataURL(file);

        const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 12), eyeMat);
        rightEye.position.set(0.2, 2.38, 0.56);
        doraGroup.add(leftEye, rightEye);

        const dressMat = new THREE.MeshStandardMaterial({
          color: 0xfacc15,
          emissive: 0xca8a04,
          emissiveIntensity: 0.25,
          roughness: 0.35
        });
        const dress = new THREE.Mesh(new THREE.ConeGeometry(0.76, 1.35, 24), dressMat);
        dress.position.y = 1.25;
        doraGroup.add(dress);

        const packMat = new THREE.MeshStandardMaterial({ color: 0x9333ea, emissive: 0x581c87, emissiveIntensity: 0.25 });
        const backpack = new THREE.Mesh(new THREE.BoxGeometry(0.76, 0.76, 0.42), packMat);
        backpack.position.set(0, 1.35, -0.45);
        doraGroup.add(backpack);

        const mapRoll = new THREE.Mesh(
          new THREE.CylinderGeometry(0.1, 0.1, 0.55, 12),
          new THREE.MeshStandardMaterial({ color: 0xfef08a })
        );
        mapRoll.position.set(0.38, 1.72, -0.45);
        mapRoll.rotation.z = -0.35;
        doraGroup.add(mapRoll);

        const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.7, 12), skinMat);
        leftArm.position.set(-0.62, 1.45, 0);
        const rightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.7, 12), skinMat);
        rightArm.position.set(0.62, 1.45, 0);
        doraGroup.add(leftArm, rightArm);

        const shoeMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const leftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.65, 12), shoeMat);
        leftLeg.position.set(-0.25, 0.35, 0);
        const rightLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.65, 12), shoeMat);
        rightLeg.position.set(0.25, 0.35, 0);
        doraGroup.add(leftLeg, rightLeg);

        const charLight = new THREE.PointLight(0xfef08a, 1.8, 14);
        charLight.position.set(0, 4, 2);
        doraGroup.add(charLight);

        scene.add(doraGroup);

        // Stage 1 Archway
        const archMat = new THREE.MeshStandardMaterial({ color: 0xc084fc, roughness: 0.3 });
        const leftPillar = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 7.5, 16), archMat);
        leftPillar.position.set(-4.8, 3.75, -2);
        const rightPillar = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 7.5, 16), archMat);
        rightPillar.position.set(4.8, 3.75, -2);
        const topArch = new THREE.Mesh(new THREE.TorusGeometry(4.8, 0.42, 16, 40, Math.PI), goldMat);
        topArch.position.set(0, 7.5, -2);
        scene.add(leftPillar, rightPillar, topArch);

        // Stage 2 Mountains & Pond
        const mountainMat = new THREE.MeshStandardMaterial({ color: 0x1e1b4b, roughness: 0.8 });
        const snowMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc });
        [
          { x: -15, z: -22, h: 17, r: 7.5 },
          { x: -21, z: -29, h: 23, r: 9.5 },
          { x: 14, z: -26, h: 19, r: 8 }
        ].forEach((m) => {
          const mt = new THREE.Mesh(new THREE.ConeGeometry(m.r, m.h, 7), mountainMat);
          mt.position.set(m.x, m.h / 2, m.z);
          scene.add(mt);
          const cap = new THREE.Mesh(new THREE.ConeGeometry(m.r * 0.36, m.h * 0.35, 7), snowMat);
          cap.position.set(m.x, m.h * 0.83, m.z);
          scene.add(cap);
        });

        const pond = new THREE.Mesh(
          new THREE.CircleGeometry(5.8, 32),
          new THREE.MeshStandardMaterial({ color: 0x06b6d4, emissive: 0x0891b2, emissiveIntensity: 0.55 })

        pond.rotation.x = -Math.PI / 2;
        pond.position.set(-11, 0.08, -24);
        scene.add(pond);

        // Stage 3: 3D Spinning DNA Double Helix for MMLS Biochemistry
        const dnaGroup = new THREE.Group();
        dnaGroup.position.set(-2.5, 5.2, -48);
        const strandMatA = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.7 });
        const strandMatB = new THREE.MeshStandardMaterial({ color: 0xc084fc, emissive: 0x9333ea, emissiveIntensity: 0.7 });
        const rungMat = new THREE.MeshStandardMaterial({ color: 0xfef08a, emissive: 0xca8a04, emissiveIntensity: 0.4 });

        for (let i = 0; i < 20; i++) {
          const y = (i - 10) * 0.42;
          const angle = i * 0.55;
          const r = 1.35;

          const sphereA = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 14), strandMatA);
          sphereA.position.set(Math.cos(angle) * r, y, Math.sin(angle) * r);
          const sphereB = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 14), strandMatB);
          sphereB.position.set(Math.cos(angle + Math.PI) * r, y, Math.sin(angle + Math.PI) * r);

          const rung = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, r * 2, 8), rungMat);
          rung.position.set(0, y, 0);
          rung.rotation.z = Math.PI / 2;
          rung.rotation.y = -angle;

          dnaGroup.add(sphereA, sphereB, rung);
        }
        scene.add(dnaGroup);

        // Stage 4: Royal Purple Kindness Crystals
        const crystalGroup = new THREE.Group();
        crystalGroup.position.set(2.5, 0, -72);
        const purpleCrystalMat = new THREE.MeshStandardMaterial({
          color: 0xa855f7,
          emissive: 0x7e22ce,
          emissiveIntensity: 0.65,
          roughness: 0.15,
          metalness: 0.3
        });

        [
          { x: 0, y: 3.2, z: 0, s: 1.4 },
          { x: -2.2, y: 2.2, z: 1.2, s: 0.95 },
          { x: 2.1, y: 2.4, z: -1.1, s: 1.05 },
          { x: 0.8, y: 4.5, z: 1.5, s: 0.75 }
        ].forEach((c) => {
          const gem = new THREE.Mesh(new THREE.OctahedronGeometry(c.s, 0), purpleCrystalMat);
          gem.position.set(c.x, c.y, c.z);
          crystalGroup.add(gem);
        });
        scene.add(crystalGroup);

        // Floating Lanterns
        const lanterns = [];
        const lanternGeo = new THREE.CylinderGeometry(0.35, 0.28, 0.9, 12);
        const lanternMat = new THREE.MeshStandardMaterial({
          color: 0xfef08a,
          emissive: 0xf59e0b,
          emissiveIntensity: 0.95

        for (let i = 0; i < 36; i++) {
          const mesh = new THREE.Mesh(lanternGeo, lanternMat);
          mesh.position.set(
            (Math.random() - 0.5) * 34,
            3.5 + Math.random() * 14,
            -40 - Math.random() * 65
          );
          scene.add(mesh);
          lanterns.push({ mesh, speed: 0.4 + Math.random() * 0.8, offset: Math.random() * 6 });
        }

        // Stage 5 Bridge
        for (let i = 0; i < 6; i++) {
          const zPos = -86 - i * 3.2;
          const postL = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 3.4, 12), goldMat);
          postL.position.set(-2.2, 1.7, zPos);
          const postR = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 3.4, 12), goldMat);
          postR.position.set(6.5, 1.7, zPos);
          const orbMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
          const orbL = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), orbMat);
          orbL.position.set(-2.2, 3.6, zPos);
          const orbR = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), orbMat);
          orbR.position.set(6.5, 3.6, zPos);
          scene.add(postL, postR, orbL, orbR);
        }

        // Stage 6 Disneyland Castle
        const castleGroup = new THREE.Group();
        castleGroup.position.set(0, 0, -128);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5d0fe, roughness: 0.35 });
        const roofMat = new THREE.MeshStandardMaterial({
          color: 0x9333ea,
          emissive: 0x581c87,
          emissiveIntensity: 0.35,
          roughness: 0.25
        });

        const keep = new THREE.Mesh(new THREE.BoxGeometry(15, 12.5, 10), wallMat);
        keep.position.y = 6.25;
        castleGroup.add(keep);

        const gate = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 2.3, 5.8, 24), goldMat);
        gate.position.set(0, 2.9, 5.05);
        castleGroup.add(gate);

        const mainTower = new THREE.Mesh(new THREE.CylinderGeometry(2.9, 3.3, 23, 24), wallMat);
        mainTower.position.set(0, 11.5, 0);
        const mainSpire = new THREE.Mesh(new THREE.ConeGeometry(3.6, 9.5, 24), roofMat);
        mainSpire.position.set(0, 27.5, 0);
        castleGroup.add(mainTower, mainSpire);

        [
          { x: -8.0, z: 4, h: 15.5, r: 1.9 },
          { x: 8.0, z: 4, h: 15.5, r: 1.9 },
          { x: -5.8, z: -3, h: 18.5, r: 2.2 },
          { x: 5.8, z: -3, h: 18.5, r: 2.2 }
        ].forEach((t) => {
          const tw = new THREE.Mesh(new THREE.CylinderGeometry(t.r, t.r * 1.1, t.h, 20), wallMat);
          tw.position.set(t.x, t.h / 2, t.z);
          const sp = new THREE.Mesh(new THREE.ConeGeometry(t.r * 1.35, 6.5, 20), roofMat);
          sp.position.set(t.x, t.h + 3.25, t.z);
          castleGroup.add(tw, sp);
        });

        scene.add(castleGroup);

        // 3D Royal Birthday Treasure Chest
        const chestGroup = new THREE.Group();
        chestGroup.position.set(0, 0.7, -118.5);
        const chestBase = new THREE.Mesh(
          new THREE.BoxGeometry(2.2, 1.2, 1.5),
          new THREE.MeshStandardMaterial({ color: 0x7e22ce, roughness: 0.3 })
        );
        const chestLid = new THREE.Mesh(
          new THREE.CylinderGeometry(0.75, 0.75, 2.2, 16, 1, false, 0, Math.PI),
          goldMat
        );
        chestLid.rotation.z = Math.PI / 2;
        chestLid.position.y = 0.6;
        chestLidRef.current = chestLid;
        chestGroup.add(chestBase, chestLid);
        scene.add(chestGroup);

        // Starfield
        const starsGeo = new THREE.BufferGeometry();
        const starCount = 1500;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
          starPositions[i] = (Math.random() - 0.5) * 240;
          starPositions[i + 1] = 8 + Math.random() * 85;
          starPositions[i + 2] = 20 - Math.random() * 195;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xfffbeb, size: 0.45 });
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        // Animation Loop
        const clock = new THREE.Clock();
        let animationFrameId;

        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          const elapsed = clock.getElapsedTime();
          const targetStage = STAGES[stageRef.current];

          const dx = targetStage.x - doraGroup.position.x;
          const dz = targetStage.z - doraGroup.position.z;
          const dist = Math.sqrt(dx * dx + dz * dz);

          doraGroup.position.x += dx * 0.045;
          doraGroup.position.z += dz * 0.045;

          if (dist > 0.35) {
            doraGroup.position.y = Math.abs(Math.sin(elapsed * 10)) * 0.25;
            leftLeg.rotation.x = Math.sin(elapsed * 10) * 0.6;
            rightLeg.rotation.x = -Math.sin(elapsed * 10) * 0.6;
            leftArm.rotation.x = -Math.sin(elapsed * 10) * 0.5;
            rightArm.rotation.x = Math.sin(elapsed * 10) * 0.5;
            doraGroup.rotation.y = Math.PI;
          } else {
            doraGroup.position.y = Math.sin(elapsed * 3) * 0.08;
            doraGroup.rotation.y += (0 - doraGroup.rotation.y) * 0.08;
            leftLeg.rotation.x = 0;
            rightLeg.rotation.x = 0;
            leftArm.rotation.x = 0;
            rightArm.rotation.z = 2.4 + Math.sin(elapsed * 8) * 0.35;
          }

          // Gently bob the 3D Floating Photo Frames
          floatingFrames.forEach((fg, idx) => {
            fg.position.y = 3.6 + Math.sin(elapsed * 2 + idx) * 0.15;
          });

          // Spin DNA Helix & Crystals
          dnaGroup.rotation.y = elapsed * 0.85;
          dnaGroup.position.y = 5.2 + Math.sin(elapsed * 2) * 0.25;

          crystalGroup.children.forEach((gem, idx) => {
            gem.rotation.y = elapsed * (0.6 + idx * 0.15);
            gem.position.y += Math.sin(elapsed * 2.5 + idx) * 0.005;
          });

          if (chestLidRef.current) {
            const targetRotX = letterOpenedRef.current ? -1.1 : 0;
            chestLidRef.current.rotation.x += (targetRotX - chestLidRef.current.rotation.x) * 0.08;
          }

          const desiredCamX = doraGroup.position.x * 0.65;
          const desiredCamY = stageRef.current === 5 ? 5.4 : 4.3;
          const desiredCamZ = doraGroup.position.z + 9.8;

          camera.position.x += (desiredCamX - camera.position.x) * 0.04;
          camera.position.y += (desiredCamY - camera.position.y) * 0.04;
          camera.position.z += (desiredCamZ - camera.position.z) * 0.04;
          camera.lookAt(
            doraGroup.position.x * 0.4,
            stageRef.current === 5 ? 5.6 : 2.5,
            doraGroup.position.z - 12
          );

          lanterns.forEach((l) => {
            l.mesh.position.y += Math.sin(elapsed * l.speed + l.offset) * 0.012;
          });

          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      const activeStage = STAGES[currentStage];
      const activePhoto = photos[currentStage];

      return (
        <div className="relative w-screen h-screen overflow-hidden select-none text-white">
          {/* 3D WebGL World Canvas */}
          <div ref={mountRef} className="absolute inset-0 z-0" />

          {/* TOP ROYAL NAVIGATION BAR */}
          <header className="relative z-20 flex flex-wrap items-center justify-between gap-2 px-4 sm:px-6 py-2.5 bg-slate-950/75 backdrop-blur-md border-b border-purple-400/30">
            <div className="flex items-center gap-2.5">
              <span className="text-2xl">🏰</span>
              <div>
                <h1 className="font-adventure text-sm sm:text-base font-bold text-amber-300 leading-none">
                  Samima's 3D Disneyland • Royal Purple Edition 💜
                </h1>
                <p className="text-[11px] text-purple-300">
                  MMLS Biochemistry Scholar • Kind & Independent Queen • Oct 28
                </p>
              </div>
            </div>

            {/* Step-by-Step 3D Checkpoint Selector */}
            <div className="flex items-center gap-1 sm:gap-1.5">
              {STAGES.map((s, idx) => (
                <button
                  key={s.id}
                  onClick={() => setCurrentStage(idx)}
                  className={`w-7 h-7 sm:w-8 sm:h-8 rounded-full font-adventure font-bold text-xs transition flex items-center justify-center border ${
                    currentStage === idx
                      ? "bg-gradient-to-r from-amber-400 via-purple-500 to-pink-500 text-white border-white scale-110 shadow-lg"
                      : idx < currentStage
                      ? "bg-purple-600/50 border-purple-300 text-white"
                      : "bg-slate-900/70 border-slate-700 text-slate-400 hover:border-amber-400"
                  }`}
                  title={s.title}
                >
                  {idx === 2 ? "🧬" : idx === 3 ? "💜" : idx === 5 ? "🏰" : idx + 1}
                </button>
              ))}
            </div>

            {/* Quick Action Buttons */}
            <div className="flex items-center gap-2">
              <button
                onClick={() => setShowGalleryModal(true)}
                className="px-3 py-1.5 rounded-full bg-purple-600/40 hover:bg-purple-600/70 border border-purple-300/50 text-xs font-semibold flex items-center gap-1 transition"
              >
                <span>📸</span> Her Photos
              </button>
              <button
                onClick={() => setShowNotesModal(true)}
                className="px-3 py-1.5 rounded-full bg-pink-600/40 hover:bg-pink-600/70 border border-pink-300/50 text-xs font-semibold flex items-center gap-1 transition"
              >
                <span>💜</span> Notes For Her
              </button>
              <div className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-900/90 border border-amber-400/40 text-xs font-semibold">
                <span className="text-amber-300">
                  {isUnlocked ? "🔓 00:00 Reached!" : "🔒 Oct 28 (00:00):"}
                </span>
                {!isUnlocked && (
                  <span className="font-mono text-pink-300 font-bold">
                    {days}d:{hours}h:{minutes}m:{seconds}s
                  </span>
                )}
              </div>
            </div>
          </header>

          {/*Helpful Banner ONLY if opened via double-click file:// protocol */}
          {isFileProtocol && (
            <div className="relative z-20 bg-amber-500/90 text-slate-950 px-4 py-1.5 text-xs font-semibold flex flex-wrap items-center justify-between gap-2">
              <span>
                💡 <strong>Local File Tip:</strong> Chrome blocks WebGL 3D textures on <code>file://</code> URLs. Run <code>python3 -m http.server 8000</code> (or push to GitHub Pages), OR select your 6 images right here to preview in 3D:
              </span>
              <label className="cursor-pointer px-3 py-0.5 rounded-full bg-slate-950 text-amber-300 font-bold hover:opacity-90">
                📂 Select 6 Photos Now
                <input
                  type="file"
                  accept="image/*"
                  multiple
                  onChange={handleBulkFolderSelect}
                  className="hidden"
                />
              </label>
            </div>
          )}

          {/* BOTTOM INTERACTIVE HUD */}
          <div className="absolute bottom-3 left-0 right-0 z-20 px-3 sm:px-6 pointer-events-none">
            <div className="max-w-6xl mx-auto grid md:grid-cols-12 gap-3 items-end">

              {/* Left Column: Dora-Samima Speech + Mini Framed Photo of Current Stage */}
              <div className="md:col-span-5 glass-royal rounded-3xl p-4 pointer-events-auto flex flex-col gap-3">
                <div className="flex items-center gap-3">
                  <img
                    src={activePhoto.url}
                    alt={activePhoto.title}
                    onClick={() => setShowGalleryModal(true)}
                    className="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl object-cover border-2 border-amber-400 shadow-md cursor-pointer hover:scale-105 transition flex-shrink-0"
                    title="Click to open full Photo Gallery & swap photos"
                  />
                  <div>
                    <div className="flex items-center gap-1.5">
                      <span className="text-[11px] font-adventure font-bold uppercase tracking-wider text-amber-300">
                        🧭 3D Dora-Samima Guide
                      </span>
                      <span className="text-[10px] px-2 py-0.5 rounded-full bg-purple-500/30 text-purple-200 border border-purple-400/40">
                        Stop {currentStage + 1}/{STAGES.length}
                      </span>
                    </div>
                    <p className="text-xs sm:text-sm text-amber-50 leading-snug font-medium mt-1">
                      “{customSpeech || activeStage.doraSpeech}”
                    </p>
                  </div>
                </div>

                <div className="px-3 py-2 rounded-2xl bg-purple-950/70 border border-purple-400/40 text-xs text-purple-200 font-medium flex items-center justify-between gap-2">
                  <span>{activeStage.noteHighlight}</span>
                  <button
                    onClick={() => setShowNotesModal(true)}
                    className="text-[11px] text-amber-300 underline whitespace-nowrap"
                  >
                    Read All →
                  </button>
                </div>
              </div>

              {/* Right Column: Current 3D Scene Story & Step-by-Step Navigation */}
              <div className={`md:col-span-7 glass-royal rounded-3xl p-4 sm:p-5 pointer-events-auto ${shakeLock ? "animate-shake" : ""}`}>
                <div className="flex flex-wrap items-center justify-between gap-2 mb-1">
                  <span className={`text-[11px] font-bold uppercase tracking-widest px-2.5 py-0.5 rounded-full bg-gradient-to-r ${activeStage.accent} text-slate-950`}>
                    {activeStage.badge}
                  </span>
                  <a
                    href="https://www.instagram.com/samimpriyu/"
                    target="_blank"
                    rel="noreferrer"
                    className="text-xs text-pink-300 hover:text-amber-300 underline font-semibold"
                  >
                    @samimpriyu 🩷
                  </a>
                </div>

                <h2 className="font-adventure text-lg sm:text-2xl font-bold text-white mt-0.5">
                  {activeStage.title}
                </h2>
                <p className="text-xs sm:text-sm text-slate-200 mt-1 leading-relaxed">
                  {activeStage.description}
                </p>

                <div className="flex flex-wrap gap-1.5 mt-2.5">
                  {activeStage.highlights.map((h, i) => (
                    <span
                      key={i}
                      className="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-purple-500/20 border border-purple-300/30 text-amber-200"

                      {h}
                    </span>
                  ))}
                </div>

                <div className="flex flex-wrap items-center justify-between gap-2 mt-4 pt-3 border-t border-white/10">
                  <button
                    onClick={() => setCurrentStage((prev) => Math.max(0, prev - 1))}
                    disabled={currentStage === 0}
                    className={`px-3.5 py-2 rounded-xl font-adventure font-bold text-xs sm:text-sm transition ${
                      currentStage === 0
                        ? "bg-slate-800/50 text-slate-500 cursor-not-allowed"
                        : "bg-slate-800 hover:bg-slate-700 text-white border border-slate-600"
                    }`}
                  >
                    ← Back
                  </button>

                  {currentStage < STAGES.length - 1 ? (
                    <button
                      onClick={() => setCurrentStage((prev) => Math.min(STAGES.length - 1, prev + 1))}
                      className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-amber-400 via-purple-500 to-pink-500 text-white font-adventure font-bold text-xs sm:text-sm shadow-lg hover:scale-105 transition transform"
                    >
                      Walk to Next Stop 🧭 →
                    </button>
                  ) : (
                    <button
                      onClick={handleTryOpenGift}
                      className={`px-5 py-2.5 rounded-xl font-adventure font-bold text-xs sm:text-sm shadow-lg transition transform ${
                        isUnlocked
                          ? "bg-gradient-to-r from-emerald-400 via-amber-300 to-pink-500 text-slate-950 hover:scale-105 animate-pulse"
                          : "bg-slate-900 border border-rose-400/60 text-rose-300 hover:bg-slate-800"
                      }`}
                    >
                      {isUnlocked
                        ? "🎁 Unwrap Royal Birthday Gift ✨"
                        : `🔒 Locked Until Oct 28, 00:00 (${days}d ${hours}h ${minutes}m ${seconds}s)`}
                    </button>
                  )}
                </div>
              </div>

            </div>
          </div>

          {/* MODAL 1: SAMIMA'S PHOTO MEMORIES GALLERY */}
          {showGalleryModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
              <div className="max-w-4xl w-full max-h-[88vh] overflow-y-auto rounded-3xl glass-royal p-6 sm:p-8 text-white relative">
                <button
                  onClick={() => setShowGalleryModal(false)}
                  className="sticky top-2 float-right w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-sm"
                >
                  ✕
                </button>
                <span className="text-xs font-bold uppercase tracking-widest text-amber-300">
                  📸 Floating 3D Disneyland Portraits
                </span>
                <h3 className="font-adventure text-2xl sm:text-3xl font-bold text-white mt-1">
                  Samima's Royal Photo Gallery ✨
                </h3>
                <p className="text-xs sm:text-sm text-purple-200 mt-1 mb-6">
                  Each photo below floats in 3D right beside its checkpoint on the Disneyland path!
                </p>

                <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
                  {photos.map((p, idx) => (
                    <div
                      key={p.id}
                      className="rounded-2xl bg-slate-900/90 border border-purple-400/40 overflow-hidden shadow-lg flex flex-col justify-between"
                    >
                      <div>
                        <div className="relative h-52 overflow-hidden bg-slate-800">
                          <img
                            src={p.url}
                            alt={p.title}
                            className="w-full h-full object-cover"
                          />
                          <span className="absolute top-2 left-2 px-2.5 py-0.5 rounded-full bg-purple-900/80 border border-amber-300/40 text-[10px] font-bold text-amber-300">
                            Stage {idx + 1} • {p.tag}
                          </span>
                        </div>
                        <div className="p-4">
                          <h4 className="font-adventure font-bold text-base text-amber-300">
                            {p.title}
                          </h4>
                          <p className="text-xs text-slate-300 mt-1">
                            {p.caption}
                          </p>
                        </div>
                      </div>
                      <div className="px-4 pb-4 flex items-center justify-between gap-2">
                        <button
                          onClick={() => {
                            setCurrentStage(idx);
                            setShowGalleryModal(false);
                          }}
                          className="text-xs font-semibold text-pink-300 hover:text-amber-300"
                        >
                          Fly to 3D Frame →
                        </button>
                        <label className="cursor-pointer px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-[11px] font-semibold text-purple-200 transition">
                          Swap Photo 📁
                          <input
                            type="file"
                            accept="image/*"
                            onChange={(e) => handlePhotoUpload(idx, e)}
                            className="hidden"
                          />
                        </label>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODAL 2: DEDICATED HEARTFELT NOTES */}
          {showNotesModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
              <div className="max-w-3xl w-full max-h-[88vh] overflow-y-auto rounded-3xl glass-royal p-6 sm:p-8 text-white relative">
                <button
                  onClick={() => setShowNotesModal(false)}
                  className="sticky top-2 float-right w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-sm"
                >
                  ✕
                </button>
                <span className="text-xs font-bold uppercase tracking-widest text-amber-300">
                  💜 Royal Scroll of Appreciation
                </span>
                <h3 className="font-adventure text-2xl sm:text-3xl font-bold text-white mt-1 mb-6">
                  Why Samima Is So Special & Royal Purple ✨
                </h3>

                <div className="grid sm:grid-cols-2 gap-4">
                  {HEART_NOTES.map((note, idx) => (
                    <div
                      key={idx}
                      className="rounded-2xl bg-purple-950/60 border border-purple-400/40 p-5 shadow-md"
                    >
                      <div className="text-3xl mb-2">{note.icon}</div>
                      <h4 className="font-adventure text-lg font-bold text-amber-300">
                        {note.title}
                      </h4>
                      <p className="text-xs sm:text-sm text-slate-200 mt-2 leading-relaxed">
                        {note.body}
                      </p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODAL 3: ROYAL BIRTHDAY LETTER (STRICTLY LOCKED UNTIL OCT 28 00:00:00) */}
          {letterOpened && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
              <div className="max-w-xl w-full max-h-[90vh] overflow-y-auto rounded-3xl bg-gradient-to-b from-slate-900 via-purple-950 to-slate-900 border-2 border-amber-400 p-6 sm:p-8 shadow-2xl text-white relative">
                <button
                  onClick={() => setLetterOpened(false)}
                  className="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-sm"
                >
                  ✕
                </button>
                <div className="flex items-center gap-3 mb-4">
                  <span className="text-4xl">👑</span>
                  <div>
                    <span className="text-[11px] uppercase tracking-widest text-amber-300 font-bold">
                      Unlocked at 00:00 • October 28
                    </span>
                    <h3 className="font-adventure text-2xl sm:text-3xl font-bold text-pink-400">
                      Happy Birthday, Princess Samima! 🎂💜
                    </h3>
                  </div>
                </div>
                <div className="space-y-3.5 text-sm sm:text-base text-slate-200 leading-relaxed">
                  <p>Dear <strong>Samima</strong>,</p>
                  <p>
                    Welcome to the heart of your very own Disneyland! Just like Dora exploring the world with fearless curiosity, you turn every single moment into pure magic. Your smile is so warm and radiant that it immediately lights up everyone around you.
                  </p>
                  <p>
                    What I admire most about you is your <strong>Royal Purple heart</strong>. Even when you are facing your own difficulties and tough days, you never stop caring for others and helping the people around you. That rare kindness, paired with your fierce independence, makes you one of the strongest women in the world.
                  </p>
                  <p>
                    As you pursue your <strong>MMLS in Biochemistry</strong>, I wish with all my heart that you achieve it in the absolute best way possible. You are going to help society, heal lives, and shine your light on everyone lucky enough to cross your path!
                  </p>
                  <p className="font-serif-royal italic text-amber-300 text-lg pt-2">
                    “Imperfection is beauty, madness is genius...” Happy October 28th, my most beloved friend! ✨🌷🧬🏰
                  </p>
                </div>
                <div className="mt-6 flex justify-end">
                  <button
                    onClick={fireConfetti}
                    className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-amber-400 via-purple-500 to-pink-500 text-white font-adventure font-bold text-sm shadow-lg"
                  >
                    🎉 Launch Royal Castle Fireworks
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
